services:
  ctfd:
    build: .
    restart: always
    # no published port: only nginx (port 80) reaches CTFd. REVERSE_PROXY=true trusts X-Forwarded-For,
    # so a directly exposed 8000 would let anyone fake their IP past the rate limits.
    environment:
      - UPLOAD_FOLDER=/var/uploads
      - DATABASE_URL=mysql+pymysql://ctfd:ctfd@db/ctfd
      - REDIS_URL=redis://cache:6379
      - WORKERS=1
      - LOG_FOLDER=/var/log/CTFd
      - ACCESS_LOG=-
      - ERROR_LOG=-
      - REVERSE_PROXY=true
    # the source is mounted read-only, so CTFd can't save its own .ctfd_secret_key: read the one the
    # permissions service keeps in .data/CTFd/secret (otherwise every restart would log everyone out)
    entrypoint: ["/bin/sh", "-c", "export SECRET_KEY=\"$$(cat /var/secret/key)\" && exec /opt/CTFd/docker-entrypoint.sh"]
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .data/CTFd/secret:/var/secret:ro
      - .:/opt/CTFd:ro
    depends_on:
      permissions:
        condition: service_completed_successfully
      db:
        condition: service_started
      cache:
        condition: service_started
    networks:
        default:
        internal:

  # TODO: CTFd 4.0 Migrate to named volumes. Users will likely need to manually migrate existing files
  permissions:
    image: alpine:3.23
    user: root
    volumes:
      - .data/CTFd/logs:/var/log/CTFd
      - .data/CTFd/uploads:/var/uploads
      - .data/CTFd/secret:/var/secret
    # fix ownership, and create the secret key once (kept across restarts and rebuilds)
    command:
      - sh
      - -ec
      - |
        chown -R 1001:1001 /var/uploads /var/log/CTFd
        if [ ! -s /var/secret/key ]; then
          head -c 48 /dev/urandom | base64 | tr -d '\n' > /var/secret/key
        fi
        chown 1001:1001 /var/secret/key
        chmod 400 /var/secret/key

  nginx:
    image: nginx:stable
    restart: always
    volumes:
      - ./conf/nginx/http.conf:/etc/nginx/nginx.conf
    ports:
      - 80:80
    depends_on:
      - ctfd

  db:
    image: mariadb:10.11
    restart: always
    environment:
      - MARIADB_ROOT_PASSWORD=ctfd
      - MARIADB_USER=ctfd
      - MARIADB_PASSWORD=ctfd
      - MARIADB_DATABASE=ctfd
      - MARIADB_AUTO_UPGRADE=1
    volumes:
      - .data/mysql:/var/lib/mysql
    networks:
        internal:
    # This command is required to set important mariadb defaults
    command: [mysqld, --character-set-server=utf8mb4, --collation-server=utf8mb4_unicode_ci, --wait_timeout=28800, --log-warnings=0]

  cache:
    image: redis:4
    restart: always
    volumes:
    - .data/redis:/data
    networks:
        internal:

networks:
    default:
    internal:
        internal: true
